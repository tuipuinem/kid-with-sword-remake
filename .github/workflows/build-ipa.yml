name: Build Zelda IPA on macOS

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'Direct download URL for game container (.nup or .nsp)'
        required: false
        default: ''
      game_language:
        description: 'Game language (ru / en)'
        required: true
        default: 'ru'

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Homebrew dependencies
        run: |
          brew install xcodegen zstd glslang
          brew install --cask dotnet-sdk

      - name: Setup Python dependencies
        run: |
          pip3 install --break-system-packages lz4 "capstone>=5,<6" fonttools nsz zbic "backports.zstd; python_version < '3.14'"

      - name: Download game container
        if: ${{ github.event.inputs.game_url != '' }}
        run: |
          mkdir -p input_game
          curl -L -o "input_game/game.nup" "${{ github.event.inputs.game_url }}"

      - name: Build IPA with Russian Language
        run: |
          python3 scripts/build_ipa_from_nsp.py input_game --language ${{ github.event.inputs.game_language }}

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zelda-Ocarina-Remake-IPA
          path: |
            *.ipa
            */*.ipa
